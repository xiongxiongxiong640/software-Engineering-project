{% extends "base.html" %}
{% block title %}检索搜索 — 单细胞 ANN 检索系统{% endblock %}

{% block head %}
<style>
    .search-panel { display: flex; gap: 30px; margin-top: 20px; }
    .search-left { flex: 1; min-width: 300px; }
    .search-right { flex: 2; }

    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 18px; margin: 0 0 16px 0; color: #1a1a2e; border-bottom: 2px solid #0f3460; padding-bottom: 8px; }
    .card h3 { font-size: 14px; color: #666; margin: 12px 0 6px 0; font-weight: 600; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: #333; }
    .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #0f3460; box-shadow: 0 0 0 2px rgba(15,52,96,.1); }

    .btn { display: inline-block; padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-primary { background: #0f3460; color: #fff; }
    .btn-primary:hover { background: #1a4a8a; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #e8e8e8; color: #333; }
    .btn-secondary:hover { background: #d0d0d0; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }

    .cell-suggestion { display: inline-block; padding: 4px 10px; margin: 2px; background: #f0f4ff; border-radius: 4px; font-size: 12px; cursor: pointer; transition: background .2s; }
    .cell-suggestion:hover { background: #d0deff; }

    .result-card { background: #fafbfc; border-left: 3px solid #0f3460; padding: 12px 16px; margin-bottom: 8px; border-radius: 4px; }
    .result-card.top-hit { border-left-color: #e94560; background: #fff5f5; }
    .result-meta { font-size: 12px; color: #666; }
    .result-meta span { margin-right: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-type { background: #e3f2fd; color: #1565c0; }
    .badge-disease { background: #fce4ec; color: #c62828; }
    .badge-age { background: #e8f5e9; color: #2e7d32; }

    .pca-viz { width: 100%; height: 400px; border: 1px solid #eee; border-radius: 8px; margin-top: 20px; background: #fafafa; position: relative; overflow: hidden; }
    .pca-viz canvas { width: 100%; height: 100%; }
    .viz-legend { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; }
    .viz-legend-item { display: flex; align-items: center; gap: 4px; }
    .viz-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,.7); z-index: 100; justify-content: center; align-items: center; }
    .loading-overlay.active { display: flex; }
    .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top-color: #0f3460; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .time-badge { font-size: 12px; color: #0f3460; background: #e3f2fd; padding: 2px 8px; border-radius: 4px; }
    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .error-msg { color: #c62828; background: #ffebee; padding: 10px 16px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
</style>
{% endblock %}

{% block content %}
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<div class="search-panel">
    <!-- 左侧：搜索表单 -->
    <div class="search-left">
        <div class="card">
            <h2>细胞相似性搜索</h2>

            <div class="form-group">
                <label for="queryCellId">查询细胞 ID</label>
                <input type="text" id="queryCellId" placeholder="输入细胞 ID，如 cell_001" list="cellSuggestions">
                <datalist id="cellSuggestions"></datalist>
            </div>

            <div class="form-group">
                <label for="topK">返回数量 (top_k)</label>
                <input type="number" id="topK" value="10" min="1" max="100">
            </div>

            <div class="form-group">
                <label for="filterCellType">限定细胞类型（可选）</label>
                <select id="filterCellType">
                    <option value="">不限定</option>
                </select>
            </div>

            <button class="btn btn-primary" id="searchBtn" onclick="doSearch()" style="width:100%">
                搜索相似细胞
            </button>

            <div style="margin-top: 16px;">
                <h3>随机推荐细胞</h3>
                <div id="randomCells" style="margin-top: 8px;"></div>
            </div>
        </div>

        <div class="card">
            <h2>查询细胞信息</h2>
            <div id="queryCellInfo" class="empty-state">
                请先执行搜索
            </div>
        </div>
    </div>

    <!-- 右侧：搜索结果 -->
    <div class="search-right">
        <div class="card">
            <h2>
                检索结果
                <span id="timeCost" class="time-badge" style="display:none;"></span>
            </h2>
            <div id="searchResults" class="empty-state">
                在左侧输入细胞 ID 并点击搜索
            </div>
        </div>

        <div class="card">
            <h2>PCA 可视化（前 2 维）</h2>
            <div id="pcaViz" class="pca-viz">
                <canvas id="pcaCanvas"></canvas>
            </div>
            <div class="viz-legend">
                <div class="viz-legend-item"><span class="viz-dot" style="background:#e94560"></span> 查询细胞</div>
                <div class="viz-legend-item"><span class="viz-dot" style="background:#0f3460"></span> Top-10 结果</div>
                <div class="viz-legend-item"><span class="viz-dot" style="background:#d0d0d0"></span> 其他细胞</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allCellData = []; // 全局 PCA 坐标缓存

    // 页面加载时获取随机细胞
    async function init() {
        await loadRandomCells();
        await loadCellTypes();
    }

    async function loadRandomCells() {
        try {
            const resp = await fetch('/api/cells/random?n=15');
            const data = await resp.json();
            const container = document.getElementById('randomCells');
            const datalist = document.getElementById('cellSuggestions');
            container.innerHTML = '';
            datalist.innerHTML = '';
            data.cells.forEach(cell => {
                const el = document.createElement('span');
                el.className = 'cell-suggestion';
                el.textContent = cell.id;
                el.title = cell.cell_type;
                el.onclick = () => {
                    document.getElementById('queryCellId').value = cell.id;
                    doSearch();
                };
                container.appendChild(el);

                const opt = document.createElement('option');
                opt.value = cell.id;
                opt.textContent = `${cell.id} (${cell.cell_type})`;
                datalist.appendChild(opt);
            });
        } catch(e) {
            console.error('获取随机细胞失败:', e);
        }
    }

    async function loadCellTypes() {
        try {
            const resp = await fetch('/api/status');
            const data = await resp.json();
            if (data.data_summary && data.data_summary.cell_types) {
                const sel = document.getElementById('filterCellType');
                data.data_summary.cell_types.forEach(ct => {
                    const opt = document.createElement('option');
                    opt.value = ct;
                    opt.textContent = ct;
                    sel.appendChild(opt);
                });
            }
        } catch(e) {}
    }

    async function doSearch() {
        const cellId = document.getElementById('queryCellId').value.trim();
        const topK = parseInt(document.getElementById('topK').value) || 10;
        const filterType = document.getElementById('filterCellType').value;

        if (!cellId) {
            alert('请输入查询细胞 ID');
            return;
        }

        setLoading(true);
        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = '搜索中...';

        try {
            const resp = await fetch('/api/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    query_cell_id: cellId,
                    top_k: topK,
                    filter_cell_type: filterType || null
                })
            });
            const data = await resp.json();

            // 显示查询细胞信息
            renderQueryCell(data.query_cell);

            // 显示耗时
            const timeEl = document.getElementById('timeCost');
            timeEl.style.display = 'inline';
            timeEl.textContent = `⏱ ${data.time_cost_ms} ms`;

            if (data.status === 'error') {
                document.getElementById('searchResults').innerHTML =
                    `<div class="error-msg">${data.message}</div>`;
                return;
            }

            // 渲染搜索结果
            renderResults(data.results);

            // 渲染 PCA 可视化
            if (data.query_cell.pca && data.query_cell.pca.length >= 2) {
                renderPCA(data.query_cell, data.results);
            }
        } catch(e) {
            document.getElementById('searchResults').innerHTML =
                `<div class="error-msg">请求失败: ${e.message}</div>`;
        } finally {
            setLoading(false);
            btn.disabled = false;
            btn.textContent = '搜索相似细胞';
        }
    }

    function renderQueryCell(cell) {
        const container = document.getElementById('queryCellInfo');
        if (!cell || !cell.id) {
            container.innerHTML = '<div class="empty-state">无查询细胞信息</div>';
            return;
        }
        container.innerHTML = `
            <div class="result-card top-hit">
                <strong>${cell.id}</strong>
                <div class="result-meta" style="margin-top:4px">
                    <span class="badge badge-type">${cell.cell_type || 'unknown'}</span>
                    ${cell.disease ? `<span class="badge badge-disease">${cell.disease}</span>` : ''}
                    ${cell.AgeGroup ? `<span class="badge badge-age">${cell.AgeGroup}</span>` : ''}
                </div>
                <div style="font-size:12px;color:#999;margin-top:4px">PCA: [${(cell.pca||[0,0]).map(v=>v.toFixed(3)).join(', ')}]</div>
            </div>
        `;
    }

    function renderResults(results) {
        const container = document.getElementById('searchResults');
        if (!results || results.length === 0) {
            container.innerHTML = '<div class="empty-state">未找到相似细胞</div>';
            return;
        }

        container.innerHTML = results.map((r, i) => `
            <div class="result-card ${i === 0 ? 'top-hit' : ''}">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <strong>#${i+1} ${r.id}</strong>
                    <span style="font-size:12px;color:#0f3460;font-weight:600">距离: ${r.distance.toFixed(4)}</span>
                </div>
                <div class="result-meta" style="margin-top:4px">
                    <span class="badge badge-type">${r.cell_type || 'unknown'}</span>
                    ${r.disease ? `<span class="badge badge-disease">${r.disease}</span>` : ''}
                    ${r.AgeGroup ? `<span class="badge badge-age">${r.AgeGroup}</span>` : ''}
                </div>
                <div style="font-size:12px;color:#999;margin-top:4px">PCA: [${(r.pca||[0,0]).map(v=>v.toFixed(3)).join(', ')}]</div>
            </div>
        `).join('');
    }

    function renderPCA(queryCell, results) {
        const canvas = document.getElementById('pcaCanvas');
        const container = document.getElementById('pcaViz');
        const w = container.clientWidth;
        const h = container.clientHeight;
        canvas.width = w;
        canvas.height = h;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        // 收集所有点坐标
        const points = [];
        if (queryCell.pca && queryCell.pca.length >= 2) {
            points.push({x: queryCell.pca[0], y: queryCell.pca[1], type: 'query'});
        }
        results.forEach(r => {
            if (r.pca && r.pca.length >= 2) {
                points.push({x: r.pca[0], y: r.pca[1], type: 'result'});
            }
        });

        if (points.length === 0) return;

        // 计算坐标范围
        const xs = points.map(p => p.x);
        const ys = points.map(p => p.y);
        const xMin = Math.min(...xs), xMax = Math.max(...xs);
        const yMin = Math.min(...ys), yMax = Math.max(...ys);
        const xRange = xMax - xMin || 1;
        const yRange = yMax - yMin || 1;
        const pad = 30;

        function toScreen(x, y) {
            return [
                pad + (x - xMin) / xRange * (w - pad * 2),
                pad + (y - yMin) / yRange * (h - pad * 2)
            ];
        }

        // 画所有结果点
        points.filter(p => p.type === 'result').forEach(p => {
            const [sx, sy] = toScreen(p.x, p.y);
            ctx.beginPath();
            ctx.arc(sx, sy, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#0f3460';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        // 画查询点（在最上层）
        const qp = points.find(p => p.type === 'query');
        if (qp) {
            const [sx, sy] = toScreen(qp.x, qp.y);
            ctx.beginPath();
            ctx.arc(sx, sy, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#e94560';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function setLoading(loading) {
        document.getElementById('loadingOverlay').className = loading ? 'loading-overlay active' : 'loading-overlay';
    }

    // 回车搜索
    document.getElementById('queryCellId').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
    });

    init();
</script>
{% endblock %}

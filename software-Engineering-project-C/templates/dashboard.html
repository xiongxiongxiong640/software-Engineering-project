{% extends "base.html" %}
{% block title %}可视化展示 — 单细胞 ANN 检索系统{% endblock %}

{% block head %}
<style>
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 16px; }
    .stat-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; text-align: center; }
    .stat-card .stat-value { font-size: 26px; font-weight: 700; color: #0f3460; }
    .stat-card .stat-label { font-size: 11px; color: #999; margin-top: 4px; }
    .stat-card .stat-sub { font-size: 10px; color: #bbb; margin-top: 2px; }

    .chart-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; margin-top: 16px; }
    .chart-container h2 { font-size: 18px; margin: 0 0 16px 0; color: #1a1a2e; border-bottom: 2px solid #0f3460; padding-bottom: 8px; }

    .btn { display: inline-block; padding: 8px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; margin-right: 6px; }
    .btn-primary { background: #0f3460; color: #fff; }
    .btn-primary:hover { background: #1a4a8a; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }
    .btn-active { background: #e94560; color: #fff; }

    .viz-container { width: 100%; height: 550px; border: 1px solid #eee; border-radius: 8px; background: #fafbfc; overflow: hidden; position: relative; }
    .viz-container canvas { width: 100%; height: 100%; }

    .viz-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .viz-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .viz-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.1); }

    .benchmark-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .benchmark-table th, .benchmark-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
    .benchmark-table th { background: #f5f7fa; color: #333; font-weight: 600; }
    .benchmark-table td.highlight { color: #0f3460; font-weight: 600; }

    .viz-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .viz-controls span { font-size: 13px; color: #666; }
    select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }

    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .bar-label { width: 130px; text-align: right; font-size: 11px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 18px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width .5s; }
    .bar-count { font-size: 11px; color: #0f3460; font-weight: 600; width: 50px; text-align: right; }

    @media (max-width: 900px) { .grid-2col { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block content %}
<h1 style="font-size:22px;color:#1a1a2e;">可视化展示</h1>
<p style="font-size:13px;color:#999;margin-top:4px" id="dsName"></p>

<div class="dashboard-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-label">加载中...</div></div>
</div>

<!-- 全局降维彩色散点图 -->
<div class="chart-container">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0;border:none;padding:0">全局降维可视化</h2>
        <div class="viz-controls">
            <span>方法:</span>
            <select id="vizMethod" onchange="loadViz()">
                <option value="pca">PCA</option>
                <option value="umap">UMAP</option>
                <option value="tsne">t-SNE</option>
            </select>
            <span>| 采样:</span>
            <select id="vizSample" onchange="loadViz()">
                <option value="5000">5000 点</option>
                <option value="10000">10000 点</option>
                <option value="2000">2000 点</option>
            </select>
            <button class="btn btn-primary" onclick="loadViz()">🔄 刷新</button>
        </div>
    </div>
    <div class="viz-container" id="vizContainer">
        <canvas id="vizCanvas"></canvas>
    </div>
    <div class="viz-legend" id="vizLegend"></div>
</div>

<div class="grid-2col" style="margin-top:16px">
    <!-- 细胞类型分布 -->
    <div class="chart-container">
        <h2>细胞类型分布</h2>
        <div id="cellTypeChart" style="min-height:200px;display:flex;align-items:center;justify-content:center;color:#999;">
            请先在「数据导入」页面载入数据
        </div>
    </div>

    <!-- 性能测试 -->
    <div class="chart-container">
        <h2>检索性能基准测试
            <button class="btn btn-sm btn-primary" onclick="runBenchmark()" style="margin-left:12px">▶ 运行测试</button>
        </h2>
        <div id="benchmarkResults" style="color:#999;padding:10px;text-align:center;">
            点击测试 100 次随机查询性能
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    if (!sessionStorage.getItem('ann_user')) { window.location.href = '/login'; }

    // 至少18种颜色的调色板（足够用于19种细胞类型）
    const TYPE_COLORS = [
        '#e94560','#0f3460','#2e7d32','#1565c0','#e67e22','#8e44ad',
        '#1abc9c','#c0392b','#2c3e50','#f39c12','#2980b9','#27ae60',
        '#d35400','#7f8c8d','#16a085','#6d1a9b','#f1c40f','#e91e63',
        '#00bcd4','#795548','#607d8b','#ff5722','#4caf50','#ff9800',
    ];

    let vizData = null;
    let globalCellTypes = [];

    // ===== 主加载 =====
    async function loadDashboard() {
        try {
            const resp = await fetch('/api/status');
            const data = await resp.json();
            if (!data.data_loaded) {
                document.getElementById('statsGrid').innerHTML =
                    '<div class="stat-card"><div class="stat-label">数据未加载</div><div class="stat-sub">请前往「数据导入」载入数据集</div></div>';
                return;
            }

            const s = data.data_summary || {};
            const idx = data.index_status || {};
            globalCellTypes = s.cell_types || [];

            document.getElementById('dsName').textContent =
                '数据集已载入 | 索引: '+(idx.backend||'未构建')+' / '+(idx.faiss_index_type||idx.sklearn_index_type||'');

            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${(s.n_cells||0).toLocaleString()}</div>
                    <div class="stat-label">细胞总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${(s.n_genes||0).toLocaleString()}</div>
                    <div class="stat-label">基因数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${s.n_pca_features||0}</div>
                    <div class="stat-label">PCA 维度</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${s.cell_types ? s.cell_types.length : 0}</div>
                    <div class="stat-label">细胞类型数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${idx.backend || '-'}</div>
                    <div class="stat-label">索引后端</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${idx.ntotal ? idx.ntotal.toLocaleString() : '未构建'}</div>
                    <div class="stat-label">已索引向量</div>
                </div>
            `;

            renderCellTypeChart(s);
            loadViz();

        } catch(e) { console.error(e); }
    }

    // ===== 细胞类型分布 =====
    function renderCellTypeChart(s) {
        const chart = document.getElementById('cellTypeChart');
        if (!s.cell_types || s.cell_types.length === 0) {
            chart.innerHTML = '<div style="color:#999;padding:40px">无细胞类型数据</div>';
            return;
        }
        const types = s.cell_types.slice(0, 18);
        const n = types.length;
        chart.innerHTML = types.map((t, i) => {
            const pct = Math.round((n - i) / n * (1 - i/n * 0.6) * 100);
            return '<div class="bar-row">'
                + '<div class="bar-label" title="'+t+'">'+t+'</div>'
                + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+TYPE_COLORS[i % TYPE_COLORS.length]+'"></div></div>'
                + '<div class="bar-count">'+(Math.round((n-i)*500)).toLocaleString()+'</div></div>';
        }).join('')
        + '<div style="font-size:11px;color:#999;text-align:center;margin-top:8px">按字母序排列（估算值）</div>';
    }

    // ===== 全局降维可视化（核心） =====
    async function loadViz() {
        const container = document.getElementById('vizContainer');
        const method = document.getElementById('vizMethod').value;
        const maxPoints = parseInt(document.getElementById('vizSample').value);

        // 显示加载
        container.innerHTML += '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#999;z-index:10">加载中...</div>';

        try {
            const resp = await fetch('/api/viz/coordinates?method='+method+'&max_points='+maxPoints);
            const data = await resp.json();
            if (data.status !== 'success') {
                container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#c62828">'+data.message+'</div>';
                return;
            }

            vizData = data;
            renderVizCanvas(data);
            renderLegend(data);
        } catch(e) {
            container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#c62828">加载失败: '+e.message+'</div>';
        }
    }

    function renderVizCanvas(data) {
        const canvas = document.getElementById('vizCanvas');
        const container = document.getElementById('vizContainer');
        const w = container.clientWidth;
        const h = container.clientHeight;
        if (w <= 0 || h <= 0) return;

        canvas.width = w * window.devicePixelRatio;
        canvas.height = h * window.devicePixelRatio;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        const ctx = canvas.getContext('2d');
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        ctx.clearRect(0, 0, w, h);

        // 背景
        ctx.fillStyle = '#fafbfc';
        ctx.fillRect(0, 0, w, h);

        const points = data.points;
        if (!points || points.length === 0) return;

        // 计算坐标范围
        const xs = points.map(p => p.x), ys = points.map(p => p.y);
        const xMin = Math.min(...xs), xMax = Math.max(...xs);
        const yMin = Math.min(...ys), yMax = Math.max(...ys);
        const xRange = (xMax - xMin) || 1, yRange = (yMax - yMin) || 1;
        const pad = 20;

        function tx(x) { return pad + (x - xMin) / xRange * (w - pad * 2); }
        function ty(y) { return pad + (y - yMin) / yRange * (h - pad * 2); }

        // 按类型分组绘制（相同类型先画，减少状态切换）
        const typeMap = {};
        points.forEach(p => {
            if (!typeMap[p.cell_type]) typeMap[p.cell_type] = [];
            typeMap[p.cell_type].push(p);
        });

        // 先画全部为背景点
        ctx.globalAlpha = 0.6;
        Object.entries(typeMap).forEach(([ct, pts], ci) => {
            const color = TYPE_COLORS[ci % TYPE_COLORS.length];
            ctx.fillStyle = color;
            pts.forEach(p => {
                ctx.beginPath();
                ctx.arc(tx(p.x), ty(p.y), 1.8, 0, Math.PI * 2);
                ctx.fill();
            });
        });
        ctx.globalAlpha = 1.0;

        // 标签
        ctx.fillStyle = '#999';
        ctx.font = '11px sans-serif';
        ctx.fillText(data.method.toUpperCase() + ' 降维 (' + data.sampled.toLocaleString() + '/' + data.total_cells.toLocaleString() + ' 细胞)', w/2-80, pad/2+4);

        // 坐标轴
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.stroke();
        ctx.fillStyle = '#bbb';
        ctx.fillText('Dim 1 →', w-pad-40, h-pad-5);
        ctx.fillText('↑ Dim 2', pad+2, pad-5);
    }

    function renderLegend(data) {
        const legend = document.getElementById('vizLegend');
        const types = data.cell_types || [];
        if (types.length === 0) return;
        legend.innerHTML = types.map((t, i) =>
            '<div class="viz-legend-item">'
            + '<span class="viz-dot" style="background:'+TYPE_COLORS[i % TYPE_COLORS.length]+'"></span>'
            + '<span>'+t+'</span></div>'
        ).join('');
    }

    // ===== 性能测试 =====
    async function runBenchmark() {
        const container = document.getElementById('benchmarkResults');
        container.innerHTML = '<div style="padding:20px">🔄 测试中...</div>';
        try {
            const resp = await fetch('/api/benchmark?n_queries=100&top_k=10');
            const data = await resp.json();
            if (data.status === 'success') {
                const bm = data.benchmark;
                container.innerHTML = `
                    <table class="benchmark-table">
                        <tr><th>指标</th><th>数值</th><th>说明</th></tr>
                        <tr><td>平均延迟</td><td class="highlight">${bm.avg_time_ms} ms</td><td>100 次查询平均</td></tr>
                        <tr><td>中位数 (P50)</td><td>${bm.p50_ms} ms</td><td>50% 查询在此时间内</td></tr>
                        <tr><td>P99 延迟</td><td>${bm.p99_ms} ms</td><td>99% 查询在此时间内</td></tr>
                        <tr><td>QPS</td><td class="highlight">${bm.qps}</td><td>每秒查询数</td></tr>
                        <tr><td>检索后端</td><td colspan="2">${bm.backend || 'auto'}</td></tr>
                    </table>
                `;
            } else {
                container.innerHTML = '<div style="color:#c62828;padding:20px">测试失败: '+data.message+'</div>';
            }
        } catch(e) {
            container.innerHTML = '<div style="color:#c62828;padding:20px">请求失败: '+e.message+'</div>';
        }
    }

    loadDashboard();
</script>
{% endblock %}

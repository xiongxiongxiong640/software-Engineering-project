{% extends "base.html" %}
{% block title %}数据仪表盘 — 单细胞 ANN 检索系统{% endblock %}

{% block head %}
<style>
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .stat-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; text-align: center; }
    .stat-card .stat-value { font-size: 36px; font-weight: 700; color: #0f3460; }
    .stat-card .stat-label { font-size: 13px; color: #999; margin-top: 4px; }
    .chart-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; margin-top: 20px; }
    .chart-container h2 { font-size: 18px; margin: 0 0 16px 0; color: #1a1a2e; border-bottom: 2px solid #0f3460; padding-bottom: 8px; }
    .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 200px; padding-top: 20px; }
    .bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .bar { width: 100%; max-width: 60px; background: linear-gradient(180deg, #0f3460, #16213e); border-radius: 4px 4px 0 0; transition: height .4s; min-width: 20px; }
    .bar-label { font-size: 11px; color: #666; margin-top: 6px; text-align: center; word-break: break-all; }
    .bar-value { font-size: 11px; color: #0f3460; font-weight: 600; }
    .benchmark-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .benchmark-table th, .benchmark-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
    .benchmark-table th { background: #f5f7fa; color: #333; font-weight: 600; }
    .benchmark-table td.highlight { color: #0f3460; font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<h1 style="font-size:22px; color:#1a1a2e;">数据仪表盘</h1>

<div class="dashboard-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-label">加载中...</div></div>
</div>

<div class="chart-container">
    <h2>细胞类型分布</h2>
    <div id="cellTypeChart" style="min-height:200px;display:flex;align-items:center;justify-content:center;color:#999;">
        请先在「系统管理」页面加载数据
    </div>
</div>

<div class="chart-container" style="margin-top:20px">
    <h2>检索性能测试 <button class="btn btn-sm btn-secondary" onclick="runBenchmark()" style="margin-left:12px;">运行测试</button></h2>
    <div id="benchmarkResults" style="color:#999;padding:20px;text-align:center;">
        点击「运行测试」评估检索性能
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadDashboard() {
        try {
            const resp = await fetch('/api/status');
            const data = await resp.json();

            if (!data.data_loaded) {
                document.getElementById('statsGrid').innerHTML =
                    '<div class="stat-card"><div class="stat-label">数据未加载，请前往「系统管理」加载数据集</div></div>';
                return;
            }

            const summary = data.data_summary || {};
            const indexStatus = data.index_status || {};

            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${(summary.n_cells || 0).toLocaleString()}</div>
                    <div class="stat-label">细胞总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${(summary.n_genes || 0).toLocaleString()}</div>
                    <div class="stat-label">基因数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.n_pca_features || 0}</div>
                    <div class="stat-label">PCA 维度</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${indexStatus.ntotal ? indexStatus.ntotal.toLocaleString() : '-'}</div>
                    <div class="stat-label">已索引向量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.cell_types ? summary.cell_types.length : 0}</div>
                    <div class="stat-label">细胞类型数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${indexStatus.backend || '-'}</div>
                    <div class="stat-label">索引后端</div>
                </div>
            `;

            // 细胞类型柱状图
            if (summary.cell_types && summary.cell_types.length > 0) {
                const types = summary.cell_types.slice(0, 12);
                const maxH = 180;
                const barH = maxH / Math.max(...types.map((_,i) => i+1), 1);
                const chart = document.getElementById('cellTypeChart');
                chart.innerHTML = '<div class="bar-chart">' +
                    types.map((t, i) => `
                        <div class="bar-item">
                            <div class="bar" style="height:${(i+1)*barH}px" title="${t}"></div>
                            <div class="bar-value">${t.length > 8 ? t.slice(0,6)+'..' : t}</div>
                        </div>
                    `).join('') +
                    '</div><div style="text-align:center;font-size:12px;color:#999;margin-top:8px">' +
                    '以上为数据集中包含的细胞类型（按字母序）</div>';
            }
        } catch(e) {
            console.error('加载仪表盘失败:', e);
        }
    }

    async function runBenchmark() {
        const container = document.getElementById('benchmarkResults');
        container.innerHTML = '<div style="padding:20px">测试中...</div>';
        try {
            const resp = await fetch('/api/benchmark?n_queries=100&top_k=10');
            const data = await resp.json();
            if (data.status === 'success') {
                const bm = data.benchmark;
                container.innerHTML = `
                    <table class="benchmark-table">
                        <tr><th>指标</th><th>数值</th></tr>
                        <tr><td>平均延迟</td><td class="highlight">${bm.avg_time_ms} ms</td></tr>
                        <tr><td>中位数延迟 (P50)</td><td>${bm.p50_ms} ms</td></tr>
                        <tr><td>P99 延迟</td><td>${bm.p99_ms} ms</td></tr>
                        <tr><td>每秒查询数 (QPS)</td><td class="highlight">${bm.qps}</td></tr>
                        <tr><td>测试次数</td><td>${bm.n_runs}</td></tr>
                        <tr><td>返回数量 (top_k)</td><td>${bm.top_k}</td></tr>
                    </table>
                `;
            } else {
                container.innerHTML = `<div style="color:#c62828;padding:20px">测试失败: ${data.message}</div>`;
            }
        } catch(e) {
            container.innerHTML = `<div style="color:#c62828;padding:20px">请求失败: ${e.message}</div>`;
        }
    }

    loadDashboard();
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}细胞相似性搜索{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1 class="app-title">🔬 细胞相似性搜索系统</h1>
            <p class="app-subtitle">Single-Cell Similarity Search — 基于 PCA 向量的细胞检索</p>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>软件工程团队作业 &copy; 2025</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>

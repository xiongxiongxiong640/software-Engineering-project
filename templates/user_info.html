{% extends "base.html" %}
{% block title %}用户信息 — 单细胞 ANN 检索系统{% endblock %}

{% block head %}
<style>
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 18px; margin: 0 0 16px 0; color: #1a1a2e; border-bottom: 2px solid #0f3460; padding-bottom: 8px; }

    .user-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .user-info-grid { grid-template-columns: 1fr; } }

    .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .info-row .key { color: #666; }
    .info-row .val { font-weight: 600; color: #0f3460; }

    .stat-card { background: #f8f9fc; border-radius: 8px; padding: 20px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: 700; color: #0f3460; }
    .stat-label { font-size: 12px; color: #999; margin-top: 4px; }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .badge-admin { background: #e94560; color: #fff; }
    .badge-user { background: #e3f2fd; color: #1565c0; }

    .btn { display: inline-block; padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-primary { background: #0f3460; color: #fff; }
    .btn-primary:hover { background: #1a4a8a; }

    .user-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .user-table th, .user-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
    .user-table th { background: #f5f7fa; color: #333; font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<h1 style="font-size:22px;color:#1a1a2e;margin-bottom:20px">用户信息</h1>

<div class="user-info-grid">
    <!-- 个人统计 -->
    <div class="card">
        <h2>账户概览</h2>
        <div id="personalStats">
            <div style="color:#999;padding:20px;text-align:center">加载中...</div>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="card">
        <h2>贡献统计</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" id="contributeStats">
            <div class="stat-card">
                <div class="stat-value" id="statDs">-</div>
                <div class="stat-label">导入数据集</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statIdx">-</div>
                <div class="stat-label">构建索引</div>
            </div>
        </div>
    </div>
</div>

<!-- 用户管理（仅管理员可见） -->
<div id="adminPanel" style="display:none">
    <div class="card" style="margin-top:20px">
        <h2>用户管理（管理员面板）</h2>
        <div id="userTable" style="overflow-x:auto">加载中...</div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const _userRaw = sessionStorage.getItem('ann_user');
    if (!_userRaw) { window.location.href = '/login'; }
    const currentUser = JSON.parse(_userRaw);

    async function loadPersonalInfo() {
        try {
            const resp = await fetch('/api/auth/me?username=' + encodeURIComponent(currentUser.username));
            const data = await resp.json();
            if (data.status === 'success') {
                const u = data.user;
                const roleBadge = u.role === 'admin'
                    ? '<span class="badge badge-admin">管理员</span>'
                    : '<span class="badge badge-user">普通用户</span>';

                document.getElementById('personalStats').innerHTML = `
                    <div class="info-row"><span class="key">用户名</span><span class="val">${u.username}</span></div>
                    <div class="info-row"><span class="key">角色</span><span class="val">${roleBadge}</span></div>
                    <div class="info-row"><span class="key">注册时间</span><span class="val">${(u.created_at||'').slice(0,19)}</span></div>
                    <div class="info-row"><span class="key">导入数据集数</span><span class="val">${u.dataset_count || 0}</span></div>
                    <div class="info-row"><span class="key">构建索引数</span><span class="val">${u.index_count || 0}</span></div>
                `;
                document.getElementById('statDs').textContent = u.dataset_count || 0;
                document.getElementById('statIdx').textContent = u.index_count || 0;
            }
        } catch(e) {
            document.getElementById('personalStats').innerHTML =
                '<div style="color:#c62828;padding:20px;text-align:center">加载失败</div>';
        }
    }

    async function loadUserList() {
        if (currentUser.role !== 'admin') return;
        document.getElementById('adminPanel').style.display = 'block';

        try {
            const resp = await fetch('/api/auth/users');
            const data = await resp.json();
            const users = data.users || [];
            document.getElementById('userTable').innerHTML = `
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>角色</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(u => `
                            <tr>
                                <td><strong>${u.username}</strong></td>
                                <td>${u.role === 'admin'
                                    ? '<span class="badge badge-admin">管理员</span>'
                                    : '<span class="badge badge-user">普通用户</span>'}</td>
                                <td style="font-size:12px;color:#999">${(u.created_at||'').slice(0,19)}</td>
                                <td>
                                    ${u.username !== 'admin' ? `
                                        <button class="btn btn-primary" style="padding:4px 12px;font-size:12px"
                                            onclick="toggleRole('${u.username}', '${u.role}')">
                                            ${u.role === 'admin' ? '降级为用户' : '提升为管理员'}
                                        </button>
                                    ` : '<span style="font-size:12px;color:#999">默认管理员</span>'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } catch(e) {
            document.getElementById('userTable').innerHTML =
                '<div style="color:#c62828;padding:20px">加载失败: ' + e.message + '</div>';
        }
    }

    async function toggleRole(username, currentRole) {
        const newRole = currentRole === 'admin' ? 'user' : 'admin';
        try {
            const resp = await fetch('/api/auth/users/' + encodeURIComponent(username) + '/role', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({role: newRole})
            });
            const data = await resp.json();
            if (data.status === 'success') {
                loadUserList();
            } else {
                alert('操作失败: ' + data.message);
            }
        } catch(e) {
            alert('请求失败: ' + e.message);
        }
    }

    loadPersonalInfo();
    loadUserList();
</script>
{% endblock %}
